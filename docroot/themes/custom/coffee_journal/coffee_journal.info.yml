name: Coffee Journal
type: theme
description: 'Minimal app-shell theme for the Coffee Journal. Standalone, no base theme.'
package: Custom
core_version_requirement: ^10.1 || ^11
base theme: false

libraries:
  - coffee_journal/global

libraries-extend:
  core/drupal.dialog:
    - coffee_journal/global
  core/drupal.ajax:
    - coffee_journal/global

regions:
  topbar:          'Top Bar'
  content:         'Content'
  status_messages: 'Status Messages'
