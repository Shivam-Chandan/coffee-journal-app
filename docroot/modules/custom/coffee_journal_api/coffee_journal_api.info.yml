name: 'Coffee Journal API'
type: module
description: 'Exposes /api/scrape-coffee (Gemini AI), /api/places/search (Google Places), and /api/user/me (current user state endpoint). API keys are read from Acquia environment variables GEMINI_API_KEY and GOOGLE_PLACES_API_KEY.'
package: Custom
core_version_requirement: ^10.1 || ^11
dependencies:
  - drupal:user
  - drupal:jsonapi
  - social_auth:social_auth
# coffee_journal_likes is used by FeedController but is NOT listed as a hard
# dependency here. A hard dependency causes a Drupal bootstrap failure when
# coffee_journal_api is already installed but coffee_journal_likes is not yet
# (which happens mid-deploy before drush cim runs). The deploy hook ensures
# all custom modules are installed before drush cim, so the service is always
# available at runtime.
