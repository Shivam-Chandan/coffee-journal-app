services:

  coffee_journal_api.orders:
    class: Drupal\coffee_journal_api\Service\CoffeeOrders
    arguments: ['@entity_type.manager', '@database', '@lock']

  coffee_journal_api.provenance:
    class: Drupal\coffee_journal_api\Service\CreationProvenance

  coffee_journal_api.journal_input:
    class: Drupal\coffee_journal_api\Service\JournalInput
    arguments: ['@entity_field.manager', '@coffee_journal_api.presenter']

  coffee_journal_api.connections:
    class: Drupal\coffee_journal_api\Service\PersonalConnections
    arguments: ['@database', '@entity_type.manager', '@datetime.time']

  coffee_journal_api.connector_journal:
    class: Drupal\coffee_journal_api\Service\ConnectorJournal
    arguments: ['@entity_type.manager', '@coffee_journal_api.presenter', '@coffee_journal_api.journal_input', '@coffee_journal_api.provenance', '@database', '@lock', '@datetime.time']

  coffee_journal_api.connector_access:
    class: Drupal\coffee_journal_api\Service\ConnectorAccess
    arguments: ['@coffee_journal_api.presenter', '@current_user', '@flood']

  coffee_journal_api.mcp:
    class: Drupal\coffee_journal_api\Service\JournalMcp
    arguments: ['@coffee_journal_api.connector_journal', '@coffee_journal_api.presenter', '@entity_field.manager', '@keyvalue.expirable', '@lock']

  coffee_journal_api.connector_auth:
    class: Drupal\coffee_journal_api\Authentication\ConnectorAuthentication
    arguments: ['@coffee_journal_api.connections']
    tags:
      - { name: authentication_provider, provider_id: coffee_connector, priority: 200 }

  coffee_journal_api.connector_responses:
    class: Drupal\coffee_journal_api\EventSubscriber\ConnectorResponses
    arguments: ['@coffee_journal_api.presenter', '@logger.channel.coffee_journal_api']
    tags:
      - { name: event_subscriber }

  coffee_journal_api.headless_session_configuration:
    class: Drupal\coffee_journal_api\Session\HeadlessSessionConfiguration
    decorates: session_configuration
    arguments: ['@coffee_journal_api.headless_session_configuration.inner']

  coffee_journal_api.paid_api_limiter:
    class: Drupal\coffee_journal_api\Service\PaidApiLimiter
    arguments: ['@flood', '@config.factory', '@lock']

  coffee_journal_api.page_http_client:
    class: GuzzleHttp\ClientInterface
    factory: ['Drupal\coffee_journal_api\Service\PageHttpClientFactory', 'create']

  coffee_journal_api.public_address_resolver:
    class: Drupal\coffee_journal_api\Service\PublicAddressResolver

  coffee_journal_api.safe_page_fetcher:
    class: Drupal\coffee_journal_api\Service\SafePageFetcher
    arguments: ['@coffee_journal_api.page_http_client', '@coffee_journal_api.public_address_resolver']

  coffee_journal_api.gemini:
    class: Drupal\coffee_journal_api\Service\GeminiService
    arguments:
      - '@http_client'
      - '@logger.channel.coffee_journal_api'
      - '@coffee_journal_api.safe_page_fetcher'

  coffee_journal_api.places:
    class: Drupal\coffee_journal_api\Service\GooglePlacesService
    arguments:
      - '@http_client'
      - '@logger.channel.coffee_journal_api'

  logger.channel.coffee_journal_api:
    parent: logger.channel_base
    arguments: ['coffee_journal_api']

  # Shared entity/JSON mapping for the headless frontend contracts. Engagement
  # repositories are optional so the API keeps working if those modules are off.
  coffee_journal_api.presenter:
    class: Drupal\coffee_journal_api\Service\HeadlessPresenter
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@file_url_generator'
      - '@coffee_journal_api.provenance'
      - '@?coffee_journal_likes.repository'
      - '@?coffee_journal_bookmark.repository'
      - '@coffee_journal_api.orders'
