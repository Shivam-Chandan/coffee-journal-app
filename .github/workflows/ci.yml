---
# =============================================================================
# CI — Code Quality Checks
# =============================================================================
# Runs on every push and pull request to catch issues early.
#
# Jobs:
#   validate      — composer validate + security audit
#   phpcs         — PHP CodeSniffer (AcquiaDrupalStrict) on custom code
#   phpstan       — PHPStan static analysis (level 1) on custom code
#
# These checks are kept fast (<3 min) by running with --dev dependencies
# installed but only scanning the small custom code surface area.
# =============================================================================

name: CI

on:
  push:
    branches-ignore:
      - 'pipelines-build-**'
      - 'dependabot/**'
      - 'github-action-test'
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job: validate — composer validate + security audit
  # ---------------------------------------------------------------------------
  validate:
    name: Composer Validate & Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      - name: Install dependencies (with dev)
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_MEMORY_LIMIT: '-1'

      - name: Security audit
        run: composer audit --no-interaction
        # Do not fail the build on audit warnings — surface them as info only.
        # Remove `continue-on-error` if you want audits to be blocking.
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Job: phpcs — PHP CodeSniffer
  # ---------------------------------------------------------------------------
  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_MEMORY_LIMIT: '-1'

      - name: Run PHP CodeSniffer
        run: |
          vendor/bin/phpcs \
            --standard=phpcs.xml.dist \
            --report=full \
            --colors \
            -p \
            docroot/modules/custom \
            docroot/themes/custom

  # ---------------------------------------------------------------------------
  # Job: phpstan — PHPStan static analysis
  # ---------------------------------------------------------------------------
  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_MEMORY_LIMIT: '-1'

      - name: Run PHPStan
        run: |
          vendor/bin/phpstan analyse \
            --configuration=phpstan.neon.dist \
            --no-progress \
            --error-format=table

  # ---------------------------------------------------------------------------
  # Gate: all-ci-passed
  # ---------------------------------------------------------------------------
  # Single status check for branch protection rules.
  # Add this check name to your branch protection instead of individual jobs.
  all-ci-passed:
    name: All CI checks passed
    if: always()
    runs-on: ubuntu-latest
    needs: [validate, phpcs, phpstan]
    steps:
      - name: Check all jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
