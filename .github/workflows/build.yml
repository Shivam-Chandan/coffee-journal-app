---
# =============================================================================
# Build — Reusable Artifact Builder
# =============================================================================
# Called by the main pipeline (pipeline.yml) after CI passes.
# Mirrors the Acquia Pipelines build exactly:
#
#   1. composer install (--no-dev, --optimize-autoloader)
#   2. Tailwind CSS compile (production, minified)
#   3. Artifact prep (strip dev files, verify integrity)
#
# The resulting artifact is uploaded to GitHub Actions artifact storage
# under the name "acquia-artifact-<run_id>" and consumed by the deploy job.
#
# Inputs:
#   ref        — git ref to build (default: the triggering ref)
#
# Outputs:
#   artifact-name — the name of the uploaded artifact
# =============================================================================

name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: 'Name of the uploaded GitHub Actions artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Artifact
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Fetch full history so git log works inside artifact-prep
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          # Extensions that Drupal 11 needs at install time
          extensions: gd, pdo_mysql, mbstring, xml, curl, zip, opcache

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'docroot/themes/custom/coffee_journal/package-lock.json'

      # ── Step 1: Composer install (no-dev, optimised) ─────────────────────
      - name: Composer install (production)
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --prefer-dist \
            --no-scripts \
            --no-progress
        env:
          COMPOSER_NO_INTERACTION: '1'
          COMPOSER_MEMORY_LIMIT: '-1'

      - name: Verify key contrib modules
        run: |
          test -d docroot/modules/contrib/social_auth_google \
            && echo "social_auth_google OK" \
            || (echo "ERROR: social_auth_google missing" && exit 1)
          test -d docroot/modules/contrib/social_auth \
            && echo "social_auth OK" \
            || (echo "ERROR: social_auth missing" && exit 1)

      # ── Step 2: Tailwind CSS build ────────────────────────────────────────
      - name: Build Tailwind CSS
        working-directory: docroot/themes/custom/coffee_journal
        run: |
          echo "==> Installing theme npm dependencies"
          npm ci --prefer-offline --no-fund --no-audit

          echo "==> Compiling Tailwind CSS (production)"
          NODE_ENV=production npx tailwindcss \
            -i ./src/css/app.css \
            -o ./css/coffee-theme.css \
            --minify

          echo "==> CSS size: $(wc -c < css/coffee-theme.css) bytes"

      # ── Step 3: Artifact preparation ─────────────────────────────────────
      - name: Prepare artifact
        run: |
          echo "==> Removing dev-only files"
          rm -f phpcs.xml.dist phpstan.neon.dist phpunit.xml.dist
          rm -f .travis.yml .env.example

          echo "==> Removing theme node_modules"
          rm -rf docroot/themes/custom/coffee_journal/node_modules

          echo "==> Ensuring required Drupal writable directories exist"
          mkdir -p docroot/sites/default/files
          mkdir -p docroot/sites/default/private

          echo "==> Verifying artifact integrity"
          test -f config/default/core.extension.yml \
            && echo "config/default OK" \
            || (echo "ERROR: core.extension.yml missing" && exit 1)
          test -f docroot/modules/custom/coffee_journal_api/coffee_journal_api.info.yml \
            && echo "coffee_journal_api module OK" \
            || (echo "ERROR: coffee_journal_api missing" && exit 1)
          test -f docroot/modules/custom/coffee_journal_access/src/EventSubscriber/FrontPageRedirectSubscriber.php \
            && echo "FrontPageRedirectSubscriber OK" \
            || (echo "ERROR: FrontPageRedirectSubscriber missing" && exit 1)
          test -f docroot/themes/custom/coffee_journal/css/coffee-theme.css \
            && echo "coffee-theme.css OK" \
            || (echo "ERROR: coffee-theme.css missing" && exit 1)
          test -f docroot/themes/custom/coffee_journal/js/app.js \
            && echo "app.js OK" \
            || (echo "ERROR: app.js missing" && exit 1)

          echo "==> Artifact ready"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Set artifact name
        id: set-artifact-name
        run: echo "name=acquia-artifact-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acquia-artifact-${{ github.run_id }}
          # Upload the entire workspace (minus .git to keep size down)
          path: |
            .
            !.git
          retention-days: 7
          if-no-files-found: error
